name: "Larix Music Reactive Lights"
description: "Receive audio stream from Larix Broadcaster and make lights react to music (Zigbee-friendly, hot-reload)"
version: "1.5.1"
slug: larix_music_lights
url: "https://github.com/Qlimuli/ha-addon-larix-music-lights"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
panel_icon: mdi:equalizer
ports:
  1935/tcp: 1935
  8890/udp: 8890
ports_description:
  1935/tcp: RTMP stream input (Larix Broadcaster)
  8890/udp: SRT stream input (optional)
map:
  - share:rw
options:
  enabled: true
  active_profile: ""
  mode: auto
  sensitivity: 1.2
  update_interval_ms: 280
  transition: 0.1
  min_brightness: 35
  max_brightness: 255
  color_mode: spectrum
  base_hue: 0
  beat_threshold: 0.4
  silence_timeout_s: 8
  rtmp_app: live
  rtmp_stream: music
  log_level: info
  light_entities: []
  area_ids: []
  bass_lights: []
  mid_lights: []
  high_lights: []
  full_lights: []
  profiles: []
schema:
  enabled: bool
  active_profile: str
  mode: list(auto|pulse|spectrum|color_cycle|brightness|cinema)
  sensitivity: float(0.1,2.0)
  update_interval_ms: int(180,500)
  transition: float(0.0,2.0)
  min_brightness: int(1,255)
  max_brightness: int(1,255)
  color_mode: list(spectrum|fixed|rainbow)
  base_hue: int(0,360)
  beat_threshold: float(0.1,1.0)
  silence_timeout_s: int(2,60)
  rtmp_app: str
  rtmp_stream: str
  log_level: list(debug|info|warning|error)
  light_entities:
    - str
  area_ids:
    - str
  bass_lights:
    - str
  mid_lights:
    - str
  high_lights:
    - str
  full_lights:
    - str
  profiles:
    - name: str
      room: str?
      area_ids:
        - str
      mode: str?
      sensitivity: float(0.1,2.0)?
      min_brightness: int(1,255)?
      max_brightness: int(1,255)?
      transition: float(0.0,2.0)?
      beat_threshold: float(0.1,1.0)?
      base_hue: int(0,360)?
      bass_lights:
        - str
      mid_lights:
        - str
      high_lights:
        - str
      full_lights:
        - str
